name: publish map
# Builds the map and puts the built page on the 'gh-pages' branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write   # to push the built page to the gh-pages branch
  pages: write      # to ask GitHub Pages to rebuild
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build.py
      - name: Push the built page to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish.sh "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: Ask GitHub Pages to rebuild (passes quietly if Pages is not switched on)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
